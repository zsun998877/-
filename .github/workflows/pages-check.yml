# 补剂打卡站：每次推送后自动检查页面是否正常
name: 页面健康检查

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
  pull_request:
      branches: [main]
          paths:
                - 'index.html'
                workflow_dispatch:  # 也允许在 Actions 页面手动点一下运行

env:
  PAGES_URL: https://zsun998877.github.io/-/

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: HTML 结构检查
        run: |
          python3 - <<'EOF'
          from html.parser import HTMLParser
          import sys

          VOID = {'area','base','br','col','embed','hr','img','input',
                  'link','meta','param','source','track','wbr'}

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if self.stack and self.stack[-1][0] == tag:
                      self.stack.pop()
                  else:
                      self.errors.append(f"标签不匹配: </{tag}> 在 {self.getpos()}")

          src = open('index.html', encoding='utf-8').read()
          c = Checker()
          c.feed(src)
          for tag, pos in c.stack:
              c.errors.append(f"未闭合标签: <{tag}> 起始于 {pos}")
          if '<title>' not in src or '补剂打卡' not in src:
              c.errors.append('页面标题缺失')
          if c.errors:
              print('\n'.join(c.errors))
              sys.exit(1)
          print('HTML 检查通过')
          EOF

      - name: 等待部署并检查线上页面
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PAGES_URL" || true)
            echo "尝试 $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "线上页面访问正常"
              exit 0
            fi
            sleep 30
          done
          echo "10 次尝试后页面仍不可访问"
          exit 1
