<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(160deg, #fff7e6 0%, #ffeef5 55%, #eef6ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: #4a3b47;
  }
  h1 {
    font-size: clamp(34px, 9vw, 54px);
    letter-spacing: 0.04em;
    color: #e75480;
    text-shadow: 0 2px 0 #fff;
    margin-bottom: 8px;
    text-align: center;
  }
  .sub {
    font-size: clamp(15px, 4.5vw, 19px);
    color: #8a6d7b;
    margin-bottom: 36px;
    text-align: center;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 420px;
  }
  @media (min-width: 720px) {
    .cards { flex-direction: row; max-width: 760px; }
    .card { flex: 1; }
  }
  .card {
    display: block;
    text-decoration: none;
    background: #ffffff;
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 8px 24px rgba(231, 84, 128, 0.15);
    border: 3px solid #ffd9e6;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active { transform: scale(0.97); }
  .card .icon { font-size: 52px; line-height: 1.2; }
  .card h2 {
    font-size: 24px;
    color: #4a3b47;
    margin: 10px 0 8px;
  }
  .card p {
    font-size: 14px;
    color: #8a6d7b;
    line-height: 1.6;
  }
  .card .go {
    display: inline-block;
    margin-top: 16px;
    background: #e75480;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    padding: 10px 28px;
    border-radius: 999px;
  }
  .card.maze { border-color: #cfe3ff; box-shadow: 0 8px 24px rgba(84, 131, 231, 0.15); }
  .card.maze .go { background: #5483e7; }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: #b39aa6;
  }
</style>
</head>
<body>
  <h1>games</h1>
  <p class="sub">あそびたいゲームをえらんでね！</p>
  <div class="cards">
    <a class="card" href="catch.html">
      <div class="icon">🎂</div>
      <h2>落下物キャッチゲーム</h2>
      <p>落ちてくるフルーツとケーキをキャッチして、60秒で300点をめざそう。ばくだんには気をつけて！</p>
      <span class="go">あそぶ</span>
    </a>
    <a class="card maze" href="maze.html">
      <div class="icon">🌀</div>
      <h2>めいろゲーム</h2>
      <p>ゆびやボタンでキャラクターを動かして、ゴールをめざそう。クリアできるかな？</p>
      <span class="go">あそぶ</span>
    </a>
  </div>
  <footer>あややハッピー！</footer>
</body>
</html>
